name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Post build errors as a commit comment
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Build failed. Errors:"
            echo '```'
            grep -E '^e: |error:|What went wrong' -A3 build.log | head -90
            echo '```'
          } > err.txt
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@err.txt

      - uses: actions/upload-artifact@v4
        with:
          name: madeer-elnet-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1-${{ github.run_number }}" \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "Madeer ElNet build ${{ github.run_number }}" \
            --notes "Debug APK. Install it on Android (allow installs from unknown sources)."
